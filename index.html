<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desafio do Dedo Nervoso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Dedo Nervoso</h1>
        <p class="instrucao">Quantos cliques consegues dar em 10 segundos?</p>
        
        <div class="placar">
            <div class="caixa">
                <span>Tempo</span>
                <h2 id="tempo">10.0</h2>
            </div>
            <div class="caixa">
                <span>Cliques</span>
                <h2 id="pontos">0</h2>
            </div>
        </div>

        <button id="btn-click">COMEÇAR!</button>
        
        <div id="area-fim" style="display: none;">
            <a id="btn-zap" target="_blank">Desafiar no WhatsApp 📲</a>
            <button id="btn-reiniciar" onclick="location.reload()">Tentar de novo 🔄</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
